# =========================
# SERVER
# =========================
server.port=8080

# IMPORTANT: removed server.servlet.context-path=/api
# Having context-path=/api means ALL routes get prefixed with /api automatically,
# so your controllers which already map to /api/users, /api/jobs etc. would become
# /api/api/users, /api/api/jobs ? causing 404 on every request.
# Remove context-path and keep the /api prefix inside your @RequestMapping annotations.

# =========================
# DATABASE (POSTGRESQL)
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/neevdb
spring.datasource.username=postgres

# Using the password you set directly.
# For production, replace with an environment variable:
#   spring.datasource.password=${DB_PASSWORD}
# and set DB_PASSWORD in your system environment or deployment config.
spring.datasource.password=Passwordin@2424

spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable Open Session in View ? good practice, keep this
spring.jpa.open-in-view=false

# =========================
# JWT
# =========================
jwt.secret=9f3c7a2d8b1e4f6c9a0d3b7e5c2f8a1d4e6c9b2f7a3d8c1e5b0a6d9f3c7e2b1
jwt.expiration.ms=86400000

# =========================
# FILE STORAGE
# =========================
file.storage.path=./uploads
file.base.url=http://localhost:8080/files

# =========================
# LOGGING
# =========================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =========================
# MISC
# =========================
spring.main.banner-mode=off